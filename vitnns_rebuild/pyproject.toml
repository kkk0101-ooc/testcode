[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitnns-rebuild"
version = "0.1.0"
description = "Auditable native-forward baseline for NNS-ViT research"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "pillow==10.2.0",
  "scipy==1.12.0",
  "timm==0.9.16",
  "torch==2.2.2",
  "torchvision==0.17.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
vitnns-stage-a = "vitnns.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: uses the real local ViT-B checkpoint and images",
  "unsafe_pickle: explicitly loads a trusted full-model pickle",
]

