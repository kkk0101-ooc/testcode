   <g id="text_1">
    <text style="fill: #28628c; font: 13px 'DejaVu Sans'; text-anchor: start" x="34.776" y="119.4804" transform="rotate(-0 34.776 119.4804)">Normal computation</text>
   </g>
   <g id="text_2">
    <text style="fill: #21384a; font: 11px 'DejaVu Sans'; text-anchor: middle" x="135.324" y="177.482312" transform="rotate(-0 135.324 177.482312)">Q, K</text>
   </g>
   <g id="text_3">
    <text style="fill: #21384a; font: 11px 'DejaVu Sans'; text-anchor: middle" x="374.724" y="177.482312" transform="rotate(-0 374.724 177.482312)">S = Q Kᵀ / √d</text>
   </g>
   <g id="text_4">
    <text style="fill: #21384a; font: 11px 'DejaVu Sans'; text-anchor: middle" x="633.276" y="177.482312" transform="rotate(-0 633.276 177.482312)">A = softmax(S)</text>
   </g>
   <g id="text_5">
    <text style="fill: #21384a; font: 11px 'DejaVu Sans'; text-anchor: middle" x="882.252" y="177.482312" transform="rotate(-0 882.252 177.482312)">O = A V</text>
   </g>
   <g id="text_6">
    <text style="fill: #168b89; font: 13px 'DejaVu Sans'; text-anchor: start" x="34.776" y="259.74" transform="rotate(-0 34.776 259.74)">Local differential propagation</text>
   </g>
   <g id="text_7">
    <text style="fill: #21384a; font: 11px 'DejaVu Sans'" transform="translate(116.538453 321.701773)">dS = dQ Kᵀ / √d</text>
    <text style="fill: #21384a; font: 11px 'DejaVu Sans'" transform="translate(116.529859 336.526852)">     + Q dKᵀ / √d</text>
   </g>
   <g id="text_8">
    <text style="fill: #21384a; font: 11px 'DejaVu Sans'" transform="translate(385.714422 321.701773)">da = [diag(a) − a aᵀ] ds</text>
    <text style="fill: #21384a; font: 11px 'DejaVu Sans'" transform="translate(378.108094 336.526852)">row-wise softmax Jacobian</text>
   </g>
   <g id="text_9">
    <text style="fill: #21384a; font: 11px 'DejaVu Sans'" transform="translate(747.004984 321.701773)">dO = (dA) V + A dV</text>
    <text style="fill: #21384a; font: 11px 'DejaVu Sans'" transform="translate(710.327719 336.526852)">routing-induced + value-induced</text>
   </g>
   <g id="text_10">
    <text style="fill: #be4248; font: 11px 'DejaVu Sans'; text-anchor: middle" x="504" y="422.7444" transform="rotate(-0 504 422.7444)">Head concat / output projection / downstream cotangent → attention branch contribution; add bypass for Total Endpoint</text>
   </g>
  </g>
  <g id="text_11">
   <text style="fill: #21384a; font: 19px 'DejaVu Sans'; text-anchor: middle" x="504" y="33.157031" transform="rotate(-0 504 33.157031)">Attention differentials reconstruct the attention branch contribution</text>
  </g>
 </g>
